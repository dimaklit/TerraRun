name = "terrarun-garmin"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://dimaklit.github.io/TerraRun/"
ALLOWED_ORIGIN = "https://dimaklit.github.io"
NOTIFY_EMAIL = "dima.klit@gmail.com"
# Fill after first deploy and from Neon Auth settings:
WORKER_URL = "https://terrarun-garmin.dima-klit.workers.dev"
NEON_AUTH_JWKS_URL = "https://ep-wandering-resonance-zamaapvp.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth/.well-known/jwks.json"

# Secrets (wrangler secret put): DATABASE_URL, GARMIN_CLIENT_ID, GARMIN_CLIENT_SECRET, STATE_SECRET, WEBHOOK_SECRET, RESEND_API_KEY

[triggers]
# every 15 min: new-user notifications; daily 04:00 UTC: stats email
crons = ["*/15 * * * *", "0 4 * * *"]
